name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  # ── Tests (Ubuntu, schnell) ─────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

  # ── Windows Build ───────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Zip Release
        run: |
          $version = (Get-Content pubspec.yaml | Select-String "^version:").ToString().Split(":")[1].Trim().Split("+")[0]
          $zipName = "DungenManager_v${version}_windows.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      # Nur bei Tag-Push → richtiges Release
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DungenManager ${{ env.VERSION }}
          body: |
            ## DungenManager ${{ env.VERSION }}

            ### Installation (Windows)
            1. ZIP herunterladen und entpacken
            2. `dungen_manager.exe` starten
            3. Fertig — keine Installation nötig
          files: ${{ env.ZIP_NAME }}
          prerelease: false
          generate_release_notes: true

      # Bei jedem Main-Push → Pre-Release (dev build)
      - name: Create Dev Pre-Release (on main push)
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Dev Build (latest main)
          body: |
            Automatisch gebaut vom letzten Commit auf `main`.
            **Kein stabiles Release** — für Entwicklung und Tests.

            Commit: ${{ github.sha }}
          files: ${{ env.ZIP_NAME }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
